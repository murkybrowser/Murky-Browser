
name: Update Platform Sources

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download latest platform sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import shutil
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          releases = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/repos/{repository}"
                  f"/releases?per_page=100&page={page}"
              )

              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  batch = json.loads(response.read())

              releases.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          platforms = {
              "-Windows": "Windows",
              "-Linux": "Linux",
              "-Android": "Android"
          }

          for prefix, folder in platforms.items():
              matching = [
                  release for release in releases
                  if release["tag_name"].endswith(prefix)
                  and release.get("published_at")
              ]

              if not matching:
                  print(f"No release found for {prefix}. Skipping.")
                  continue

              latest = max(
                  matching,
                  key=lambda release: release["published_at"]
              )

              print(
                  f"Updating {folder} from "
                  f"{latest['tag_name']} "
                  f"({latest['published_at']})"
              )

              archive_url = latest["zipball_url"]
              request = urllib.request.Request(
                  archive_url,
                  headers=headers
              )

              with tempfile.TemporaryDirectory() as temporary:
                  temporary = Path(temporary)
                  archive_path = temporary / "source.zip"
                  extract_path = temporary / "extracted"

                  extract_path.mkdir()

                  with urllib.request.urlopen(request) as response:
                      archive_path.write_bytes(response.read())

                  with zipfile.ZipFile(archive_path) as archive:
                      roots = {
                          name.split("/")[0]
                          for name in archive.namelist()
                          if name and "/" in name
                      }

                      if len(roots) != 1:
                          raise RuntimeError(
                              f"Unexpected archive structure: {latest['tag_name']}"
                          )

                      root = roots.pop()

                      for member in archive.infolist():
                          if not member.filename.startswith(root + "/"):
                              continue

                          archive.extract(member, extract_path)

                  source = extract_path / root
                  destination = Path(folder)

                  if not source.is_dir():
                      raise RuntimeError(
                          f"Source directory missing for {latest['tag_name']}"
                      )

                  if destination.exists():
                      shutil.rmtree(destination)

                  shutil.copytree(source, destination)

              print(f"{folder} successfully updated.")

          for folder in platforms.values():
              Path(folder).mkdir(exist_ok=True)

          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- Windows Linux Android

          if ! git diff --cached --quiet; then
            git commit -m "Update platform source code"
            git push
          else
            echo "No changes to commit."
          fi
