<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self';" />
<title>Murky</title>
<style>
  :root {
    --bg: #0A1412;
    --surface: #10201D;
    --text: #E4EDE9;
    --text-dim: #8FA69E;
    --accent: #E3A857;
    --danger: #E0654F;
    --ui-font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono-font: "Cascadia Mono", "Consolas", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 82%, var(--text)); outline-offset: 3px; border-radius: 4px; }
  html, body {
    margin: 0; height: 100%;
    background-image: var(--bg-image, none), linear-gradient(180deg, var(--bg), color-mix(in srgb, var(--bg) 85%, black));
    background-size: var(--bg-fit, cover), auto;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    color: var(--text);
    font-family: var(--ui-font);
    font-size: 13.5px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .wrap {
    max-width: 560px; min-height: 100%; margin: 0 auto; padding: 64px 28px 28px;
    display: flex; flex-direction: column;
    animation: fadeUp .28s ease both;
  }
  #icon { width: 28px; height: 28px; color: var(--accent); margin-bottom: 16px; flex: none; }
  #icon.warn { color: #F2C14E; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; letter-spacing: .1px; }
  .lead { color: var(--text-dim); font-size: 13.5px; line-height: 1.6; margin: 0; }
  .addr { color: var(--text-dim); font-size: 12px; margin: 10px 0 0; opacity: .75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; -webkit-user-select: text; }
  .actions { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0 0; }
  .link { background: none; border: 0; padding: 0; font: inherit; color: var(--text-dim); cursor: pointer; transition: color .15s ease; }
  .link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .link.primary { color: var(--accent); }
  .link.primary:hover { color: color-mix(in srgb, var(--accent) 70%, var(--text)); }
  .link.danger { color: var(--danger); }
  details { margin-top: 26px; }
  summary { display: flex; align-items: center; gap: 4px; width: fit-content; cursor: pointer; color: var(--text-dim); font-size: 12px; list-style: none; transition: color .15s ease; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--text); }
  .chev { width: 16px; height: 16px; margin-left: -3px; transition: transform .18s ease; }
  details[open] .chev { transform: rotate(90deg); }
  .tech { margin-top: 10px; padding-left: 13px; color: var(--text-dim); font-size: 11.5px; line-height: 1.7; user-select: text; -webkit-user-select: text; }
  .tech p { margin: 0 0 8px; }
  .tech code { font-family: var(--mono-font); }
  #gameWrap { margin-top: auto; padding-top: 32px; }
  #game { display: block; width: 100%; height: 200px; cursor: pointer; touch-action: none;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(180deg, transparent 0, #000 12%, #000 88%, transparent 100%);
    mask-composite: intersect; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); color: var(--text-dim); font-size: 12.5px; animation: fadeUp .2s ease both; }
  .music { position: fixed; top: 18px; right: 20px; width: 172px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; animation: fadeUp .28s ease both; }
  .music p { margin: 0; color: var(--text-dim); font-size: 12px; line-height: 1.45; }
  .music-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent); transition: background .15s ease, transform .15s ease, border-color .15s ease; }
  .music-btn:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .music-btn:active { transform: scale(.94); }
  .music-btn svg { width: 18px; height: 18px; display: block; }
  @media (max-width: 880px) { .music { position: static; width: auto; margin: 18px 28px 0 auto; max-width: 240px; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main class="wrap">
    <svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
    <h1 id="title">Something went wrong</h1>
    <p class="lead" id="lead"></p>
    <p class="addr" id="addr" hidden></p>

    <div class="actions" id="actions"></div>

    <details id="adv" hidden>
      <summary>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right preview-icon chev"><path d="m9 18 6-6-6-6"/></svg>
        <span id="advSummary">Technical details</span>
      </summary>
      <div class="tech" id="tech"></div>
    </details>

    <div id="gameWrap" hidden>
      <canvas id="game" tabindex="0" aria-label="Murky"></canvas>
    </div>
  </main>
  <aside class="music" id="music" hidden>
    <p id="musicT">Listen to some music while you wait?</p>
    <button class="music-btn" id="musicBtn" type="button" aria-pressed="false"></button>
  </aside>
  <script src="error.js"></script>
  <script src="error-game.js"></script>
  <script src="error-music.data.js"></script>
  <script src="error-music.js"></script>
</body>
</html>
