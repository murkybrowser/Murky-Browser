  nodes.forEach((x,i)=>{if(vals?.[i]!=null)x.n.nodeValue=vals[i];}); localExtLanguage=target;
}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');}
function theme(s){
  if(!s)return;
  root.style.setProperty('--bg',s.background||'#0A1412');
  root.style.setProperty('--surface',s.surface||'#10201D');
  root.style.setProperty('--accent',s.accent||'#E3A857');
  const bg=String(s.background||'#0A1412').replace('#','');
  const n=parseInt(bg,16);
  const whiteness=(((n>>16)&255)+((n>>8)&255)+(n&255))/765;
  const light=whiteness>0.75;
  root.style.setProperty('--text',light?'#000000':'#FFFFFF');
  root.style.setProperty('--text-dim',light?'#555555':'#A8A8A8');
  root.style.setProperty('--danger',s.danger||'#E0654F');
  root.style.setProperty('--toolbar-scale',s.toolbarScale||1);
  applyMurkyTextScale(s.uiFontScale||1);
  document.body.classList.remove('font-serif','font-mono','font-rounded');
  if(s.fontFamily==='serif') document.body.classList.add('font-serif');
  if(s.fontFamily==='mono') document.body.classList.add('font-mono');
  if(s.fontFamily==='rounded') document.body.classList.add('font-rounded');
  document.body.style.fontSize=`${13.5*(Number(s.uiFontScale)||1)}px`;
}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2600);}
function render(){
  list.innerHTML='';
  if(!xs.length){list.innerHTML='<div class="extension-empty">No extensions installed yet.<br>Use Upload to add a local extension.</div>'; return;}
  xs.forEach(x=>{
    const row=document.createElement('div'); row.className='extension-row';
    row.innerHTML=`<div class="extension-icon"><img src="${esc(x.icon||'../assets/logo_light.png')}" alt=""></div><div class="extension-info"><div class="extension-name">${esc(x.name)}</div><div class="extension-desc">${esc(x.description||'No description provided.')}</div><div class="extension-meta">Version ${esc(x.version||'—')} · Manifest V${esc(x.manifestVersion||'2')} · ${x.loaded?'Loaded':'Not loaded'}</div></div><div class="extension-actions"><button class="extension-danger">Delete</button></div>`;
    row.querySelector('.extension-danger').onclick=async()=>{xs=await window.murkyPage.removeExtension(x.id);render();showToast('Extension deleted');};
    list.appendChild(row);
  });
}
function page(name){
  $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.panel===name));
  $$('.panel').forEach(p=>p.classList.remove('active'));
  const target=$(`#panel-${name}`); if(target) target.classList.add('active');
  if(name==='extensions') render();
}
$$('.nav-item').forEach(b=>b.onclick=()=>page(b.dataset.panel));
$('#browse').onclick=async()=>{const r=await window.murkyPage.chooseExtension();if(r?.error)showToast(r.error);else if(r?.extension){xs=await window.murkyPage.listExtensions();page('extensions'); window.murkyPage.getSettings().then(localizeExtensionsUi).catch(()=>{}); showToast(`${r.extension.name} installed`);}};
$('#addAnother').onclick=()=>page('upload');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag');}); drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',async e=>{e.preventDefault();drop.classList.remove('drag');const f=e.dataTransfer.files?.[0];if(!f)return;const path=f.path;if(!path){showToast('Murky could not access that file.');return;}const r=await window.murkyPage.installExtensionPath(path);if(r?.ok){xs=await window.murkyPage.listExtensions();page('extensions'); window.murkyPage.getSettings().then(localizeExtensionsUi).catch(()=>{}); showToast(`${r.extension.name} installed`);}else showToast(r?.error||'Could not install extension');});
window.murkyPage.onExtensionsUpdate?.(data=>{xs=data||[];if(listPage.classList.contains('active')){render(); window.murkyPage.getSettings().then(localizeExtensionsUi).catch(()=>{});}});
(async()=>{const s=await window.murkyPage.getSettings();theme(s);xs=await window.murkyPage.listExtensions();render(); await localizeExtensionsUi(s);})();
window.murkyPage.onSettingsUpdate?.((s)=>{theme(s); localizeExtensionsUi(s).catch(()=>{});});
</script></body></html>
