<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>Murky Developer Tools</title><link rel="stylesheet" href="devtools.css"></head>
<body>
<header class="topbar"><div class="brandline"><img class="murky-logo" src="../assets/logo_amber.png" alt="Murky"><div><strong>Murky Developer Tools</strong></div></div><div class="header-actions"><button id="commandPalette" class="icon-button" title="Command palette (Ctrl+Shift+P)" aria-label="Command palette"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-terminal-icon lucide-terminal"><path d="M12 19h8"/><path d="m4 17 6-6-6-6"/></svg></button><button id="close" class="icon-button" title="Close Developer Tools" aria-label="Close Developer Tools"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></header>
<nav class="tabs" role="tablist">
<button class="tab active" data-tab="console">Console</button><button class="tab" data-tab="elements">Elements</button><button class="tab" data-tab="network">Network</button><button class="tab" data-tab="sources">Sources</button><button class="tab" data-tab="application">Application</button><button class="tab" data-tab="performance">Performance</button><button class="tab" data-tab="security">Security</button><button class="tab" data-tab="memory">Memory</button>
</nav>
<section id="console" class="panel active"><div class="toolbar"><button id="clearConsole">Clear</button><label><input id="preserveConsole" type="checkbox"> Preserve</label><button id="consoleLevels">Levels</button><span class="spacer"></span><input id="consoleFilter" class="filter" placeholder="Filter console…"><button id="copyConsole">Copy</button></div><div id="consoleOut" class="output"></div><div class="prompt"><span>›</span><textarea id="cmd" rows="1" spellcheck="false" autocomplete="off" placeholder="Run JavaScript…"></textarea><button id="run" class="primary">Run</button></div></section>
<section id="elements" class="panel"><div class="toolbar"><input id="elementFilter" class="filter" placeholder="Find in DOM…"><button id="expandElements">Expand all</button><button id="collapseElements">Collapse all</button><button id="refreshElements">Refresh</button><button id="copyElements">Copy</button></div><div id="elementsOut" class="elements-tree" aria-label="DOM tree">Loading DOM…</div><aside id="elementInspector" class="inspector hidden"></aside></section>
<section id="network" class="panel"><div class="toolbar"><button id="clearNetwork">Clear</button><label><input id="networkAutoScroll" type="checkbox" checked> Auto-scroll</label><button id="exportNetwork">Export HAR-ish JSON</button><span class="spacer"></span><select id="networkTypeSelect" aria-label="Network type"><option value="">All types</option><option value="document">document</option><option value="script">script</option><option value="stylesheet">stylesheet</option><option value="image">image</option><option value="fetch">fetch</option><option value="xhr">xhr</option><option value="other">other</option></select><input id="networkFilter" class="filter" placeholder="Filter requests…"></div><div class="network-head"><span>Status</span><span>Type</span><span>Method</span><span>Request</span></div><div id="networkOut" class="network-list"></div><div id="networkDetail" class="drawer hidden"></div></section>
<section id="sources" class="panel"><div class="split"><div class="source-list"><div class="toolbar"><button id="refreshSources">Refresh</button><input id="sourceFilter" class="filter" placeholder="Filter sources…"></div><div id="sourcesOut" class="source-items"></div></div><div class="source-view"><div class="toolbar"><span id="sourceTitle">No source selected</span><span class="spacer"></span><button id="copySource">Copy</button></div><pre id="sourceCode" class="source-code">Select a resource.</pre></div></div></section>
<section id="application" class="panel"><div class="toolbar"><button id="refreshStorage">Refresh</button><button id="copyStorage">Copy</button><span class="spacer"></span><button id="clearLocal">Clear local</button><button id="clearSession">Clear session</button><button id="clearCookies">Clear cookies</button></div><div class="storage-grid"><div class="card"><div class="card-title">Local Storage</div><pre id="localStorageOut" class="code-output"></pre></div><div class="card"><div class="card-title">Session Storage</div><pre id="sessionStorageOut" class="code-output"></pre></div><div class="card"><div class="card-title">Cookies</div><pre id="cookiesOut" class="code-output"></pre></div></div></section>
<section id="performance" class="panel"><div class="toolbar"><button id="refreshPerformance">Refresh metrics</button><button id="refreshPageInfo">Page info</button><button id="takeScreenshot">Screenshot</button></div><div id="performanceOut" class="metrics"></div></section>
<section id="security" class="panel"><div class="toolbar"><button id="refreshSecurity">Recheck security</button></div><div id="securityOut" class="security-grid"></div></section>
<section id="memory" class="panel"><div class="toolbar"><button id="refreshMemory">Refresh memory</button><button id="gcHint">GC hint</button></div><div id="memoryOut" class="metrics"></div></section>
<div id="palette" class="modal hidden"><div class="palette-box"><input id="paletteInput" autofocus placeholder="Type a command…"><div id="paletteItems"></div></div></div>
<script src="devtools.js"></script></body></html>
