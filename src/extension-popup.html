<!doctype html><html><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline';"><title>Murky Extensions</title>
<style>
:root{--bg:#0A1412;--surface:#10201D;--surface2:#172B27;--border:rgba(255,255,255,.11);--text:#E7EFEC;--dim:#92A49F;--accent:#E3A857;--ui:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:var(--ui);background:transparent;color:var(--text);overflow:hidden;-webkit-user-select:none;user-select:none}body{background:transparent;border:0;border-radius:12px;box-shadow:none;overflow:hidden;transform-origin:50% 0;opacity:0;transform:translateY(-7px) scale(.985)}
body.open{animation:popIn .18s cubic-bezier(.2,.8,.2,1) forwards}body.close{animation:popOut .15s cubic-bezier(.4,0,1,1) forwards}@keyframes popIn{from{opacity:0;transform:translateY(-7px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes popOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-5px) scale(.99)}}
.shell{height:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 98%,transparent),var(--bg));border:1px solid var(--border);border-radius:12px;overflow:hidden}.listView{height:100%;display:flex;flex-direction:column}.listHead{height:44px;display:flex;align-items:center;padding:0 13px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--surface) 98%,transparent)}.listTitle{font-size:12px;font-weight:700}.list{flex:1;overflow:auto;padding:6px}.item{cursor:pointer;display:grid;grid-template-columns:34px 1fr 29px;gap:9px;align-items:center;padding:8px;border-radius:9px;transition:background .15s ease, color .15s ease}.item:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}.item:focus-visible{outline:1px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-1px}.icon{width:32px;height:32px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--border)}.icon img{width:25px;height:25px;object-fit:contain;-webkit-user-drag:none;pointer-events:none}.name{font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:9.5px;color:var(--dim);margin-top:2px}.pin{width:27px;height:27px;border:0;border-radius:7px;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer}.pin:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--text)}.pin.pinned{color:var(--accent)}.pin svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pin.pinned svg{fill:currentColor}.empty{padding:30px 16px;text-align:center;color:var(--dim);font-size:10.5px;line-height:1.55}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 58%,var(--surface2));border-radius:999px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--accent) 78%,var(--surface2));background-clip:padding-box}
</style>  <script src="lucide.js"></script>
</head><body><div class="shell"><section class="listView"><div class="listHead"><div class="listTitle" id="popupTitle">Extensions</div></div><div class="list" id="list"></div></section></div><script>
const root=document.documentElement,list=document.getElementById('list');let state={extensions:[],settings:null};
const L={};let localOn=false;const KEYS=["Extensions","No extensions installed yet.","Unnamed extension","Version {v}","Installed","Click to run extension","Unpin","Pin"];
const t=k=>Object.prototype.hasOwnProperty.call(L,k)?L[k]:k;
async function loadLocal(){try{const out=await window.murkyExtensions.localizeText(KEYS);for(const k of Object.keys(L))delete L[k];KEYS.forEach((k,i)=>{if(Array.isArray(out)&&out[i]!=null&&out[i]!==k)L[k]=String(out[i]);});}catch{}localOn=Object.keys(L).length>0;if(localOn)document.body.setAttribute('data-murky-no-translate','');else document.body.removeAttribute('data-murky-no-translate');const ti=document.getElementById('popupTitle');if(ti)ti.textContent=t('Extensions');}
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function theme(s){if(!s)return;root.style.setProperty('--bg',s.background||'#0A1412');root.style.setProperty('--surface',s.surface||'#10201D');root.style.setProperty('--surface2',s.surface2||s.surface||'#172B27');root.style.setProperty('--border',s.border||'rgba(255,255,255,.11)');const bg=String(s.background||'#0A1412').replace('#','');const n=parseInt(bg,16);const whiteness=(((n>>16)&255)+((n>>8)&255)+(n&255))/765;const light=whiteness>0.75;root.style.setProperty('--text',light?'#000000':'#FFFFFF');root.style.setProperty('--dim',light?'#555555':'#A8A8A8');root.style.setProperty('--accent',s.accent||'#E3A857');const f=s.fontFamily==='mono'?'Cascadia Mono,Consolas,monospace':s.fontFamily==='serif'?'Georgia,serif':s.fontFamily==='rounded'?'Arial Rounded MT Bold,Segoe UI,sans-serif':'Segoe UI,system-ui,sans-serif';root.style.setProperty('--ui',f);document.body.style.fontSize=`${13.5*(Number(s.uiFontScale)||1)}px`;}
function render(){const xs=Array.isArray(state.extensions)?state.extensions:[];list.innerHTML='';if(!xs.length){list.innerHTML='';const em=document.createElement('div');em.className='empty';em.textContent=t('No extensions installed yet.');list.appendChild(em);return;}xs.forEach(x=>{const row=document.createElement('div');row.className='item';row.title=t('Click to run extension');row.tabIndex=0;row.innerHTML=`<div class="icon"><img src="${esc(x.icon||'')}" alt=""></div><div><div class="name">${esc(x.name||t('Unnamed extension'))}</div><div class="meta">${esc(x.version?t('Version {v}').replace('{v}',x.version):t('Installed'))}</div></div><button class="pin ${x.pinned?'pinned':''}" title="${x.pinned?t('Unpin'):t('Pin')}"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pin"><path d="M12 17v5"></path><path d="M5 7h14"></path><path d="M7 3h10l1 4-3 4v3H9v-3L6 7Z"></path></svg></button>`;row.querySelector('.pin').onclick=async e=>{e.stopPropagation();try{state.extensions=await window.murkyExtensions.pin(x.id,!x.pinned);render();}catch{}};const run=async()=>{try{await window.murkyExtensions.activate(x.id);}catch{}};row.onclick=run;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();run();}};list.appendChild(row);});}
function animate(mode){document.body.classList.remove('open','close');void document.body.offsetWidth;document.body.classList.add(mode==='close'?'close':'open');}
window.murkyExtensions.onData(data=>{state=data||state;if(state.settings)theme(state.settings);render();});window.murkyExtensions.onSettings(st=>{theme(st);loadLocal().then(render);});window.murkyExtensions.onView(()=>{loadLocal().then(render);});window.murkyExtensions.onAnimation(animate);
(async()=>{await loadLocal();try{const data=await window.murkyExtensions.getState();state=data||state;if(state.settings)theme(state.settings);render();}catch{} animate('open');})();
</script></body></html>
