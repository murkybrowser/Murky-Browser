<!doctype html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Murky Onboarding</title><link rel="stylesheet" href="onboarding.css"></head>
<body>
  <div class="onboarding-backdrop"></div>
  <button class="app-close" id="appClose" aria-label="Close Murky" title="Close Murky">×</button>
  <main class="onboarding-popup" role="dialog" aria-modal="true">
    <div class="brand"><img src="../assets/logo_amber.png" alt="Murky" draggable="false"></div>
    <div class="stage" id="stage"></div>
    <div class="dots" id="dots"></div>
    <div class="actions" id="actions"></div>
  </main>
<script src="onboarding.js"></script>
</body>
</html>
