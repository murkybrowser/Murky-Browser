<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; script-src 'self'; connect-src 'self';" />
<title>Murky</title>
<link rel="stylesheet" href="styles.css" />

<style id="murky-home-photo-center-transparent">

</style>
  <script src="lucide.js"></script>
</head>
<body>

  
  <header class="titlebar" id="titlebar">
    <div class="brand no-drag" id="brandMenuBtn" title="Murky Menu">
      <img src="../assets/logo_amber.png" class="brand-logo" alt="Murky" draggable="false" />
    </div>

    <div class="tabstrip" id="tabstrip"></div>

    <div class="tab-scroll-controls no-drag" id="tabScrollControls" hidden aria-label="Tab navigation">
      <button class="tab-scroll-btn" id="tabScrollLeft" title="Scroll tabs left" aria-label="Scroll tabs left">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </button>
      <button class="tab-scroll-btn" id="tabScrollRight" title="Scroll tabs right" aria-label="Scroll tabs right">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </button>
    </div>

    <button class="icon-btn no-drag new-tab-btn" id="newTabBtn" title="New tab (Ctrl+T)">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    </button>

    <div class="titlebar-spacer"></div>

    <div class="win-controls no-drag">
      <button class="win-btn" id="winMin" title="Minimize"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-minus-icon lucide-minus"><path d="M5 12h14"/></svg></button>
      <button class="win-btn" id="winMax" title="Maximize"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-icon lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg></button>
      <button class="win-btn win-close" id="winClose" title="Close"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </header>

  
  <div class="toolbar" id="toolbar">
    <div class="nav-cluster">
      <button class="icon-btn" id="navBack" title="Back"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="navForward" title="Forward"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg></button>
      <button class="icon-btn" id="navReload" title="Reload"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-cw-icon lucide-rotate-cw"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="icon-btn" id="navHome" title="Home"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-house-icon lucide-house"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    </div>

    <div class="address-wrap">
      <div class="address-pill" id="addressPill">
        <div class="address-row">
          <div class="site-slot no-drag" id="siteSlot">
            <img class="site-murky-icon" id="siteMurkyIcon" src="../assets/logo_amber.png" alt="Murky" title="Murky page" draggable="false" hidden />
            <button class="pill-btn" id="siteInfoBtn" title="Site information" aria-label="Site information" aria-haspopup="dialog" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-2 preview-icon"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            </button>
          </div>
          <span class="address-status" id="addressStatus" aria-hidden="true"></span>
          <input id="addressInput" class="address-input" spellcheck="false" autocomplete="off" placeholder="Search Murky or type a URL" />
          <button class="pill-btn" id="starBtn" title="Bookmark this page">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star-icon lucide-star"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="quick-actions">
      <button class="icon-btn" id="extensionsBtn" title="Extensions" aria-label="Extensions">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-puzzle-icon lucide-puzzle"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0-.474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg>
      </button>
      <button class="icon-btn" id="sidebarToggle" title="Toggle sidebar (Ctrl+Shift+B)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-panel-left-icon lucide-panel-left"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <button class="icon-btn" id="downloadsBtn" title="Downloads">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download-icon lucide-download"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
        <span class="badge-dot" id="downloadsBadge" hidden></span>
      </button>
      <button class="icon-btn" id="menuBtn" title="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis-icon lucide-ellipsis"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </div>
  </div>

  
  <div class="body-area">
    <aside class="sidebar-rail" id="sidebarRail">
      <button class="rail-btn" data-panel="bookmarks" title="Bookmarks">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star-icon lucide-star"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
      </button>
      <button class="rail-btn" data-panel="history" title="History">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw-clock-icon lucide-rotate-ccw-clock"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
      </button>
      <button class="rail-btn" data-panel="downloads" title="Downloads">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download-icon lucide-download"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn rail-settings-btn" id="railSettingsBtn" title="Murky Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </aside>

    <div class="sidebar-flyout" id="sidebarFlyout" hidden>
      <div class="flyout-panel active" id="panel-bookmarks">
        <div class="flyout-head"><span>Bookmarks</span></div>
        <div class="empty-hint" id="bookmarksEmpty">No bookmarks yet, tap the star in the address bar to save a page.</div>
        <ul class="side-list" id="bookmarksList"></ul>
      </div>

      <div class="flyout-panel" id="panel-history">
        <div class="flyout-head">
          <span>Recent activity</span>
          <button class="text-btn no-press" id="clearHistoryBtn">Clear</button>
        </div>
        <div class="empty-hint" id="historyEmpty">Pages you visit will show up here.</div>
        <ul class="side-list" id="historyList"></ul>
      </div>

      <div class="flyout-panel" id="panel-downloads">
        <div class="flyout-head"><span>Downloads</span></div>
        <div class="empty-hint" id="downloadsEmpty">Downloads will appear here.</div>
        <ul class="side-list" id="downloadsList"></ul>
      </div>
    </div>

    <div class="content-spacer" id="contentSpacer"></div>
  </div>

  
  <div class="browser-dialog-backdrop" id="browserDialogBackdrop" hidden aria-hidden="true"></div>
  <section class="browser-dialog" id="browserDialog" hidden role="dialog" aria-modal="true" aria-labelledby="browserDialogTitle">
    <div class="browser-dialog-head">
      <img src="../assets/logo_amber.png" alt="Murky" class="browser-dialog-logo" draggable="false" />
      <div class="browser-dialog-heading">
        <div class="browser-dialog-title" id="browserDialogTitle">Website message</div>
        <div class="browser-dialog-site" id="browserDialogSite"></div>
      </div>
    </div>
    <div class="browser-dialog-message" id="browserDialogMessage"></div>
    <input class="browser-dialog-input" id="browserDialogInput" type="text" autocomplete="off" hidden />
    <div class="browser-dialog-actions" id="browserDialogActions"></div>
  </section>

  
  <div class="downloads-popup" id="downloadsPopup"></div>

  <script src="renderer.js"></script>
</body>
</html>
